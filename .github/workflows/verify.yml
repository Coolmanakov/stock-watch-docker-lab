name: Verify lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r tests/requirements.txt
      - run: python -m pytest -q tests
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke.py
      - name: Check volume persistence
        run: |
          curl --fail --silent http://localhost:8080/api/products > /tmp/products-before.json
          curl --fail --silent http://localhost:8080/api/analyses > /tmp/analyses-before.json
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          curl --fail --silent http://localhost:8080/api/products > /tmp/products-after.json
          curl --fail --silent http://localhost:8080/api/analyses > /tmp/analyses-after.json
          cmp /tmp/products-before.json /tmp/products-after.json
          cmp /tmp/analyses-before.json /tmp/analyses-after.json
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean CI environment
        if: always()
        run: docker compose down -v
